# Baut die Windows-Version (Setup-Installer + portable .exe) und die Android-App (APK)
# und veröffentlicht alles als GitHub-Release.
# Auslöser: ein Versions-Tag wie v1.1.0 (git tag v1.1.0 && git push --tags)
# oder ohne Git: auf GitHub unter "Actions" → "Release (Windows .exe)" → "Run workflow" → Version eintragen.
name: Release (Windows .exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versions-Tag (z. B. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Setup-.exe und portable .exe bauen
        working-directory: desktop
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Dateien für das Release ablegen
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/HollowPines-Setup.exe
            desktop/dist/HollowPines.exe

  build-android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor-Projekt anlegen
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp -r ../index.html ../style.css ../js ../vendor www/
          npx cap add android
          cp MainActivity.java android/app/src/main/java/com/anonym239/hollowpines/MainActivity.java
          V="${TAG#v}"; IFS=. read -r MA MI PA <<< "$V"; CODE=$(( MA * 10000 + MI * 100 + ${PA:-0} ))
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /></manifest>#' $M
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ../desktop/icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp ../desktop/icon.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android

      - name: APK bauen
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK signieren
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'hollowpines-2026' }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          KS=mobile/hollowpines-release.p12
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ks.p12; KS=ks.p12; fi
          $BT/apksigner sign --ks $KS --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias hollowpines --out HollowPines.apk aligned.apk
          $BT/apksigner verify --print-certs HollowPines.apk

      - name: APK für das Release ablegen
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: HollowPines.apk

  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]   # erst wenn beides fertig ist – ein einziger Release-Vorgang
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Hollow Pines ${{ env.TAG }}
          body: |
            🌲 **Hollow Pines** – Koop-Horror für 1–4 Spieler.

            ### Download (Windows)
            - **`HollowPines-Setup.exe`** – Installer: wählt einen Ordner, legt Desktop- und Startmenü-Verknüpfung an, deinstallierbar über „Apps“.
            - **`HollowPines.exe`** – portable Version, ohne Installation (Doppelklick genügt).

            ### Download (Android)
            - **`HollowPines.apk`** – auf dem Handy herunterladen und antippen. Beim ersten Mal „Installation aus unbekannten Quellen“ für den Browser erlauben. Neue Versionen meldet die App selbst.

            Falls Windows warnt („Der Computer wurde durch Windows geschützt“): *Weitere Informationen* → *Trotzdem ausführen*.

            ### Neu in dieser Version
            - Keine Browser-Abfragen mehr: alle Fragen (Überspringen, Löschen, Passwort …) erscheinen im Spiel, der Vollbildmodus bleibt
            - 📱 Handy (App & Website): Knöpfe im Menü lassen sich wieder antippen
            - 📱 Touch-Steuerung aufgeräumt: Gadget-Knöpfe nur, wenn man das Gadget hat; Van-Knöpfe nur am Van; kompakteres HUD
            - 🖥 Menü passt ohne Scrollen auf den Bildschirm (Knöpfe zweispaltig)
            - Fehler behoben: „NACHT X“-Einblendung und Blackjack-Karten wurden falsch angezeigt
          files: |
            dist/HollowPines-Setup.exe
            dist/HollowPines.exe
            dist/HollowPines.apk
          make_latest: true
