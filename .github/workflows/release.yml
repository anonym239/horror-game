# Baut die Windows-Version (Setup-Installer + portable .exe) und veröffentlicht sie als GitHub-Release.
# Auslöser: ein Versions-Tag wie v1.1.0 (git tag v1.1.0 && git push --tags)
# oder ohne Git: auf GitHub unter "Actions" → "Release (Windows .exe)" → "Run workflow" → Version eintragen.
name: Release (Windows .exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versions-Tag (z. B. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Setup-.exe und portable .exe bauen
        working-directory: desktop
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Hollow Pines ${{ env.TAG }}
          body: |
            🌲 **Hollow Pines** – Koop-Horror für 1–4 Spieler.

            ### Download (Windows)
            - **`HollowPines-Setup.exe`** – Installer: wählt einen Ordner, legt Desktop- und Startmenü-Verknüpfung an, deinstallierbar über „Apps“.
            - **`HollowPines.exe`** – portable Version, ohne Installation (Doppelklick genügt).

            Falls Windows warnt („Der Computer wurde durch Windows geschützt“): *Weitere Informationen* → *Trotzdem ausführen*.

            ### Neu in dieser Version
            - Geisterblick-Brille (X): teures Premium-Gadget ab Tag 1 – zeigt alle Monster rot durch Wände, 3 Stufen
            - Van-Upgrade: Discokugel, Kühlbox (Ausdauer lädt schnell), Radio mit 4 Sendern (R), Hupe als Monster-Köder (J)
            - Adrenalin-Spritze (T): 8 s unendlich Ausdauer und +30 % Tempo
            - Verstecken in den Camp-Hütten: Monster können dich dort nicht sehen
            - Item-Scanner muss jetzt im Shop gekauft werden; Scanner-Fehler mit Items im Inventar behoben
            - Neue Story mit Crane-SMS nach jeder Nacht und Tonbändern von 1987, lautere Van-Musik, Easter Eggs
          files: |
            desktop/dist/HollowPines-Setup.exe
            desktop/dist/HollowPines.exe
          make_latest: true
